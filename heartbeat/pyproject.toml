[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "athena-heartbeat"
version = "0.1.0"
description = "Proactive heartbeat service for Athena — scheduled agent check-ins"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0,<4.0",    # Async scheduler (stable v3)
    "httpx>=0.27.0",                # Async HTTP client for Kibana converse API
    "pydantic-settings>=2.5.0",     # Configuration from env vars
    "python-dotenv>=1.0.0",         # Load .env files
    "python-frontmatter>=1.1.0",    # Parse vault YAML frontmatter
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

# --- Ruff (linter + formatter) ---
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modernize syntax)
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "ANN", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]
