[project]
name = "athena-voice-client"
version = "0.1.0"
description = "Voice proxy server for Athena — serves static UI and proxies Kibana + OpenAI APIs"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0",         # Async HTTP server (static files + proxy routes)
    "httpx>=0.27.0",            # Async HTTP client (forwarding to external APIs)
    "pydantic-settings>=2.5.0", # Config from env vars
    "python-dotenv>=1.0.0",     # Load .env files
    "python-frontmatter>=1.1.0", # Parse skill frontmatter for name injection
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
