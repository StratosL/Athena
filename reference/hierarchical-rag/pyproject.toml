[project]
name = "hierarchical-rag"
version = "0.1.0"
description = "Hierarchical RAG Workshop - Multi-Level Retrieval with PostgreSQL + pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "docling>=2.72.0",
    "openai>=2.16.0",
    "pgvector>=0.4.2",
    "pydantic-ai-slim[openrouter]>=1.53.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "transformers>=4.57.6",
]

[project.scripts]
hrag = "src.cli:main"
