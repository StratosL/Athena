# Athena — Docker Compose orchestration
#
# Usage:
#   docker compose up                        — start all backend services
#   docker compose --profile tunnel up       — also start ngrok tunnel for MCP
#
# Vault access:
#   Set VAULT_PATH in .env to your local Obsidian vault path.
#   It's mounted at /vault inside the container (read-write).

services:
  # --- Artemis Backend ---
  artemis:
    build:
      context: ${ARTEMIS_PATH:-../Artemis/backend}
    ports:
      - "8000:8000"
    env_file:
      - ${ARTEMIS_PATH:-../Artemis/backend}/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --- Athena MCP Server ---
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8001}:8001"
    volumes:
      - "${VAULT_PATH:-.}/sample-vault:/vault:rw"
    env_file:
      - .env
    environment:
      - VAULT_PATH=/vault
      - ARTEMIS_BASE_URL=http://artemis:8000
    depends_on:
      artemis:
        condition: service_healthy
    restart: unless-stopped

  # --- Athena Voice Proxy ---
  voice-proxy:
    build:
      context: ./voice-client
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped

  # --- ngrok tunnel (optional — use --profile tunnel) ---
  ngrok:
    profiles:
      - tunnel
    image: ngrok/ngrok:latest
    command: http mcp-server:8001
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - mcp-server
    restart: unless-stopped
