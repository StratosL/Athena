# Athena — Docker Compose orchestration
# Runs the MCP server with vault volume mount alongside Artemis
#
# Usage:
#   docker compose up              — start MCP server (assumes Artemis running separately)
#   docker compose --profile full up — start MCP server + Artemis backend
#
# Vault access:
#   Set VAULT_PATH in .env to your local Obsidian vault path.
#   It's mounted at /vault inside the container (read-write).

services:
  # --- Athena MCP Server ---
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8001}:8001"
    volumes:
      - "${VAULT_PATH:-.}/sample-vault:/vault:rw"   # Mount Obsidian vault
    env_file:
      - .env
    environment:
      - VAULT_PATH=/vault
      - ARTEMIS_BASE_URL=http://artemis:8000
    depends_on:
      artemis:
        condition: service_healthy
    restart: unless-stopped

  # --- Artemis Backend (optional — use --profile full) ---
  artemis:
    profiles:
      - full
    build:
      context: ${ARTEMIS_PATH:-../Artemis/backend}
    ports:
      - "8000:8000"
    env_file:
      - ${ARTEMIS_PATH:-../Artemis/backend}/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
