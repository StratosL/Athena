# Athena — Docker Compose orchestration
#
# Usage:
#   docker compose up                        — start all services (backend + frontend)
#   docker compose --profile tunnel up       — also start ngrok tunnel for MCP
#
# Vault access:
#   Set VAULT_PATH in .env to your local Obsidian vault path.
#   It's mounted at /vault inside the container (read-write).

services:
  # --- Artemis Backend ---
  artemis:
    build:
      context: ./services/artemis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- Athena MCP Server ---
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8001}:8001"
    volumes:
      - "${VAULT_PATH:-./sample-vault}:/vault:rw"
    env_file:
      - .env
    environment:
      - VAULT_PATH=/vault
      - ARTEMIS_BASE_URL=http://artemis:8000
    depends_on:
      artemis:
        condition: service_started
    restart: unless-stopped

  # --- Athena Voice Proxy ---
  voice-proxy:
    build:
      context: ./voice-client
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped

  # --- Artemis Frontend ---
  artemis-frontend:
    build:
      context: ./frontend
      args:
        - SUPABASE_URL=${SUPABASE_URL:-}
        - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - voice-proxy
    restart: unless-stopped

  # --- ngrok tunnel (optional — use --profile tunnel) ---
  ngrok:
    profiles:
      - tunnel
    image: ngrok/ngrok:latest
    command: http mcp-server:8001
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - mcp-server
    restart: unless-stopped
