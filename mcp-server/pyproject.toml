[project]
name = "athena-mcp-server"
version = "0.1.0"
description = "Unified MCP server for Athena — vault, Artemis, knowledge, and research tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.3.0",             # MCP protocol server (SSE transport)
    "httpx>=0.27.0",                # Async HTTP client for Artemis API
    "elasticsearch[async]>=8.17.0", # ES client for knowledge write-back
    "python-frontmatter>=1.1.0",    # Parse/write Obsidian YAML frontmatter
    "pydantic>=2.7.0",              # Data validation for tool inputs/outputs
    "pydantic-settings>=2.5.0",     # Configuration from env vars
    "python-dotenv>=1.0.0",         # Load .env files
    "html2text>=2024.2.26",         # URL content extraction (research tools)
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

# --- Ruff (linter + formatter) ---
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modernize syntax)
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "ANN", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
